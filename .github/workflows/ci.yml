name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminology:
    runs-on: [self-hosted, synology]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - run: |
          # Exclude protocol-layer files where eBUS spec terminology is unavoidable
          if git grep -nIwiE 'm[a]ster|s[l]ave' -- \
              ':!protocol/slave_encode.go' \
              ':!protocol/bus.go' \
              ':!protocol/protocol.go' \
              ':!protocol/initiator_address_test.go' \
              ':!protocol/address_class.go' \
              ':!protocol/address_class_test.go' \
              ':!protocol/validate_frame_addressing.go' \
              ':!protocol/validate_frame_addressing_test.go' \
              ':!emulation/' \
              ':!transport/ebusd_tcp.go' \
              ':!README.md'; then
            echo "Found legacy terminology."
            exit 1
          fi

  public-symbols:
    runs-on: [self-hosted, synology]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: ./scripts/public_symbol_gate.sh

  build:
    runs-on: [self-hosted, synology]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go build ./...

  test:
    runs-on: [self-hosted, synology]
    timeout-minutes: 45
    env:
      GOFLAGS: -p=4
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test -race -count=1 ./...

  tinygo:                                    # ebusgo and ebusreg only
    runs-on: [self-hosted, synology]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.40.1'
      - run: |
          mains=$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d')
          if [ -z "$mains" ]; then
            echo "No main packages found; skipping TinyGo build."
            exit 0
          fi
          for pkg in $mains; do
            echo "tinygo build -target esp32-coreboard-v2 $pkg"
            tinygo build -target esp32-coreboard-v2 "$pkg"
          done

  lint:
    runs-on: [self-hosted, synology]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: golangci/golangci-lint-action@v6
